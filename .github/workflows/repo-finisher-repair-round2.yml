name: RepoFinisher CI repair round 2

on:
  push:
    branches: ['casebuddy/completion-2026-08-30']
    paths:
      - '.repo-finisher/apply_ci_repairs_round2.py'
      - '.github/workflows/repo-finisher-repair-round2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: casebuddy/completion-2026-08-30
          fetch-depth: 0

      - name: Apply bounded CI repairs
        run: python3 .repo-finisher/apply_ci_repairs_round2.py

      - name: Validate patch whitespace
        run: git diff --check

      - name: Commit repaired sources
        run: |
          if git diff --quiet; then
            echo 'No repairs needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components supabase/functions/ocr-document/index.ts
          git commit -m 'fix: clear remaining TypeScript and Deno CI errors'
          git push origin HEAD:casebuddy/completion-2026-08-30
