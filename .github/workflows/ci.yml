name: CaseBuddy CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'casebuddy/**']

permissions:
  contents: read

concurrency:
  group: casebuddy-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, security, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Deterministic install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Security typecheck
        run: npm run typecheck:security

      - name: Client secret scan
        run: npm run check:client-secrets

      - name: Production build
        run: npm run build
