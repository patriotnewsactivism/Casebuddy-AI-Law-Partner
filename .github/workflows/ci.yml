name: CaseBuddy CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'casebuddy/**']

permissions:
  contents: read

concurrency:
  group: casebuddy-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, security, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Deterministic install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Security typecheck
        run: npm run typecheck:security

      - name: Production build
        run: npm run build

      - name: Client secret scan
        run: npm run check:client-secrets

  edge-functions:
    name: Supabase Edge Function typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Edge Function entrypoints
        run: deno check supabase/functions/deepgram-token/index.ts supabase/functions/ocr-document/index.ts supabase/functions/pipeline-orchestrator/index.ts supabase/functions/pipeline-worker/index.ts supabase/functions/tts-generate/index.ts

  public-intake-contract:
    name: Public intake authorization contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client

      - name: Create Supabase database roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin;
          SQL

      - name: Run public intake authorization regression suite
        env:
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/public_intake_authorization_test.sql 2>&1 | tee /tmp/public-intake-test.log
          if grep -q 'FAIL' /tmp/public-intake-test.log; then
            echo 'Public intake authorization regression suite reported FAIL'
            exit 1
          fi
          grep -q 'T17 anon RPC execute retained: PASS' /tmp/public-intake-test.log
