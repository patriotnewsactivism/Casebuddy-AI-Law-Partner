name: CaseBuddy CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'casebuddy/**']

permissions:
  contents: read

concurrency:
  group: casebuddy-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, security, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Deterministic install
        run: npm ci

      # Run the security-critical surface first so a pre-existing legacy
      # typecheck failure cannot hide regressions in credential/intake boundaries.
      # The full typecheck remains mandatory immediately afterward.
      - name: Security typecheck
        run: npm run typecheck:security

      - name: Typecheck
        run: npm run typecheck

      # Preserve diagnostic coverage even if legacy typecheck debt fails above.
      # These steps do not waive that failure; they simply make build/secret-scan
      # evidence available in the same CI run.
      - name: Production build
        if: ${{ always() }}
        run: npm run build

      # This scanner inspects emitted dist assets, so it must run after Vite has
      # built them. `npm run build` also runs the same sentinel internally; this
      # explicit pass keeps the CI evidence visible as a separate step.
      - name: Client secret scan
        if: ${{ always() }}
        run: npm run check:client-secrets

  edge-functions:
    name: Supabase Edge Function typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Edge Function entrypoints
        run: deno check supabase/functions/deepgram-token/index.ts supabase/functions/ocr-document/index.ts supabase/functions/pipeline-orchestrator/index.ts supabase/functions/pipeline-worker/index.ts supabase/functions/tts-generate/index.ts
