name: RepoFinisher public intake contract

on:
  push:
    branches: ['casebuddy/completion-2026-08-30']
    paths:
      - '.repo-finisher/apply_public_intake_contract.py'
      - '.github/workflows/repo-finisher-public-intake-contract.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: casebuddy/completion-2026-08-30
          fetch-depth: 0

      - name: Apply bounded client contract
        run: python3 .repo-finisher/apply_public_intake_contract.py

      - name: Validate patch whitespace
        run: git diff --check

      - name: Commit contract changes
        run: |
          if git diff --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/intakeStore.ts services/clientInviteStore.ts components/PublicIntake.tsx components/IntakePage.tsx .env.example
          git commit -m 'security: move public intake clients to token-bound RPC'
          git push origin HEAD:casebuddy/completion-2026-08-30
